name: Build Samsung A04 Max Overclock Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main, master, latest-B ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Kernel Repository
        uses: actions/checkout@v4
        with:
          repository: Halk56855/android_kernel_samsung_a04m
          ref: latest-B

      - name: Set up Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc yasm zlib1g-dev python3 git-core wget zip unzip

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchain/clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchain/clang

      - name: Setup Environment Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          # البحث التلقائي والدقيق عن مجلد bin الخاص بـ Clang
          CLANG_BIN=$(find $PWD/toolchain/clang -type d -name "bin" | head -n 1)
          echo "Clang bin path: $CLANG_BIN"
          echo "PATH=$CLANG_BIN:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      - name: Apply Configuration and Build Kernel
        run: |
          mkdir -p out
          DEFCONFIG_PATH=$(find . -name "a04_defconfig" | head -n 1)
          
          if [ -n "$DEFCONFIG_PATH" ] && [ -f "$DEFCONFIG_PATH" ]; then
            echo "تم العثور على ملف التهيئة بنجاح في: $DEFCONFIG_PATH"
            
            # إضافة خيارات الأداء والشبكة بشكل آمن وصحيح
            echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_DEFAULT_BBR=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_NET_SCH_FQ=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_DEFAULT_NET_SCH=\"fq\"" >> "$DEFCONFIG_PATH"
            echo "CONFIG_SCHED_SMT=y" >> "$DEFCONFIG_PATH"
            
            # بدء التجميع بالاسم الصحيح لملف التهيئة
            make O=out ARCH=arm64 $(basename "$DEFCONFIG_PATH")
            
            make -j$(nproc --all) O=out \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi-
          else
            echo "خطأ: لم يتم العثور على ملف a04_defconfig في المشروع نهائياً."
            exit 1
          fi

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git anykernel/README.md
          
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          else
            cp out/arch/arm64/boot/Image anykernel/
          fi
          
          cd anykernel
          zip -r9 ../Kernel-Samsung-A04-Max-OC.zip *

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Samsung-A04-Max-OC
          path: Kernel-Samsung-A04-Max-OC.zip
